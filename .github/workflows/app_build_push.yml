name: Build Image to Docker Hub
run-name: Build Image to Docker Hub (${{ inputs.request_id }})

# run-name с request_id — не украшение: appspro находит запуск именно по нему,
# другого способа связать dispatch с run у GitHub нет.
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Request ID (ставится appspro, вручную не заполнять)"
        required: false
        default: ""

jobs:
  build_push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Image to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPO_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPO_NAME }}:${{ github.sha }}
          # Ни build-аргументов, ни похода в Vault: конфигурация целиком
          # подставляется на ноде переменными NUXT_*. Образ одинаков для любого
          # окружения, и в его слоях нечему утечь.
          platforms: linux/amd64

          # Сжатие оставлено по умолчанию. С compression-level=9 экспорт слоёв
          # занимал 192 с из 312 — при том, что заливка в реестр укладывается
          # в 9 с. Максимальный gzip выигрывает проценты размера ценой минут.
          #
          # provenance/sbom выключены: подписи происхождения добавляют лишний
          # проход по слоям, а образ и так собирается только этим workflow.
          provenance: false
          sbom: false
