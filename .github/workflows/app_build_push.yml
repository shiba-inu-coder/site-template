name: Build Image to Docker Hub

on:
  workflow_dispatch:

jobs:
  build_push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Retrieve Secrets from Vault and set as Environment Variables
        uses: hashicorp/vault-action@v2
        with:
          url: ${{ secrets.VAULT_URL }}
          tlsSkipVerify: false
          token: ${{ secrets.VAULT_PROJECT_TOKEN }}
          secrets: |
            secret/data/ci/${{ secrets.VAULT_SECRET_POLICY_NAME }} mongo_uri ;
            secret/data/ci/${{ secrets.VAULT_SECRET_POLICY_NAME }} cloudinary_cloud_name ;

      - name: Build and Push Image to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPO_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPO_NAME }}:${{ github.sha }}
          build-args: |
            mongo_uri=${{ env.MONGO_URI }}
            cloudinary_cloud_name=${{ env.CLOUDINARY_CLOUD_NAME }}
            docker_hub_tag=${{ github.sha }}
            canonical_domain=${{ secrets.CANONICAL_DOMAIN }}
            db_name=${{ secrets.DB_NAME }}
            domain_name=${{ secrets.DOMAIN_NAME }}
            site_url=${{ secrets.SITE_URL }}
          platforms: linux/amd64
          outputs: type=registry,compression=gzip,compression-level=9
